# TEMPORARY recon: dump the flysfo board's row schema to the job log, to
# check for an aircraft-registration field. Delete after one run.
name: board-recon
on:
  push:
    branches: [claude/overlapping-fields-late-flights-51lh6h]
permissions: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch board, dump field names
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request, gzip
          req = urllib.request.Request(
              "https://www.flysfo.com/flysfo/api/flight-status")
          req.add_header("Accept-Encoding", "gzip")
          req.add_header("User-Agent",
              "sfo-lounge-monitor/0.1 (personal, read-only)")
          with urllib.request.urlopen(req, timeout=45) as r:
              body = r.read()
              if (r.headers.get("Content-Encoding") or "").lower() == "gzip":
                  body = gzip.decompress(body)
          data = json.loads(body)
          rows = data if isinstance(data, list) else next(
              (v for v in data.values() if isinstance(v, list)), [])
          print("total rows:", len(rows))
          keys = {}
          for row in rows:
              if isinstance(row, dict):
                  for k, v in row.items():
                      keys.setdefault(k, type(v).__name__)
          print("ALL FIELDS:", json.dumps(keys, indent=1, sort_keys=True))
          hits = [k for k in keys if re.search(
              r"reg|tail|aircraft|equip|rotat|link|inbound|prev|ship", k, re.I)]
          print("AIRCRAFT-ISH FIELDS:", hits)
          dep = next((x for x in rows if isinstance(x, dict)
                      and x.get("flight_kind") == "Departure"
                      and x.get("actual_in_off_block_time")), None)
          print("SAMPLE DEPARTURE ROW:")
          print(json.dumps(dep, indent=1, default=str)[:4000])
          EOF
